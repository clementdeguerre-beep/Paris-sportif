[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisvalue"
version = "0.1.0"
description = "Analyse de paris tennis (ATP/WTA) : probabilités, value bets, Kelly, backtest et suivi"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "streamlit>=1.35",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tennisvalue = "tennisvalue.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

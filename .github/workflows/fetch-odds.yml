# Relève les cotes toutes les 3 heures en journée et les
# ajoute au dépôt dans tennis-value/data/snapshots/. Sur l'ordinateur :
#   git pull && .venv/bin/tennisvalue import-odds
# Prérequis : secret ODDS_API_KEY (Settings > Secrets and variables > Actions).
name: Relevé des cotes

on:
  schedule:
    # Heures UTC : 7 h, 10 h, 13 h, 16 h, 19 h, soit 8 h -> 20 h à Paris en hiver,
    # 9 h -> 21 h en été.
    - cron: "7 7-19/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-odds

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tennis-value
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tennis-value/pyproject.toml
      # Installation éditable : les chemins (data/snapshots…) restent relatifs au dépôt.
      - run: pip install -e .
      - name: Relevé
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: tennisvalue fetch-odds --export
      - name: Enregistrement dans le dépôt
        run: |
          if [ -z "$(git status --porcelain data/snapshots)" ]; then echo "Aucun nouveau relevé."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git commit -m "Relevé des cotes $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1

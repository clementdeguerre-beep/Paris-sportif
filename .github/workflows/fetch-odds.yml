# Toutes les 3 heures en journée : relève les matchs Polymarket (argent réellement misé,
# gratuit) puis les cotes des bookmakers, et les ajoute au dépôt dans
# tennis-value/data/polymarket/ et tennis-value/data/snapshots/. Sur l'ordinateur :
#   git pull && .venv/bin/tennisvalue import-odds && .venv/bin/tennisvalue import-polymarket
# Prérequis : secret ODDS_API_KEY (Settings > Secrets and variables > Actions).
name: Relevé des cotes

on:
  schedule:
    # Heures UTC : 7 h 31, 10 h 31, 13 h 31, 16 h 31, 19 h 31, soit 8 h 30 -> 20 h 30 à
    # Paris en hiver, 9 h 30 -> 21 h 30 en été. À la demi-heure : GitHub, très chargé en
    # début d'heure, y retarde ou saute moins de relevés planifiés.
    - cron: "31 7-19/3 * * *"
  workflow_dispatch:
    inputs:
      cotes:
        description: "Relever aussi les cotes des bookmakers (crédits The Odds API)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fetch-odds

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tennis-value
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tennis-value/pyproject.toml
      # Installation éditable : les chemins (data/snapshots…) restent relatifs au dépôt.
      - run: pip install -e .
      - name: Relevé Polymarket
        continue-on-error: true          # un souci chez Polymarket n'empêche pas le relevé des cotes
        run: tennisvalue fetch-polymarket --export
      - name: Relevé des cotes
        if: github.event_name == 'schedule' || inputs.cotes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: tennisvalue fetch-odds --export
      - name: Enregistrement dans le dépôt
        if: always()                     # garde le relevé Polymarket même si celui des cotes échoue
        run: |
          if [ -z "$(git status --porcelain data/snapshots data/polymarket)" ]; then echo "Aucun nouveau relevé."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/polymarket
          git commit -m "Relevé des cotes et de Polymarket $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1

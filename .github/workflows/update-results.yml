# Chaque lundi matin, télécharge les résultats de la saison sur tennis-data.co.uk
# (ATP et WTA ; en janvier, aussi la saison précédente) et les ajoute au dépôt.
# L'application propose alors « Recalculer le modèle ».
name: Mise à jour des résultats

on:
  schedule:
    - cron: "37 6 * * 1"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tennis-value/data/raw/tennis-data
    steps:
      - uses: actions/checkout@v5
      - name: Téléchargement
        run: |
          year=$(date +%Y)
          years=$year
          if [ "$(date +%m)" = 01 ]; then years="$((year - 1)) $year"; fi
          ok=0
          for y in $years; do
            for tour in atp wta; do
              suffix=""; if [ "$tour" = wta ]; then suffix=w; fi
              url="http://www.tennis-data.co.uk/${y}${suffix}/${y}.xlsx"
              # Un vrai fichier xlsx est une archive zip (pas une page d'erreur HTML).
              if curl -fsSL -o new.xlsx "$url" && python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).testzip()" new.xlsx; then
                mv new.xlsx "$tour/$y.xlsx"; ok=$((ok + 1)); echo "$url : OK"
              else
                rm -f new.xlsx; echo "::warning::$url indisponible"
              fi
            done
          done
          if [ "$ok" = 0 ]; then echo "::error::Aucun fichier téléchargé"; exit 1; fi
      - name: Enregistrement dans le dépôt
        run: |
          if [ -z "$(git status --porcelain .)" ]; then echo "Pas de nouveaux résultats."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Résultats tennis-data du $(date +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
